name: Release

# Push a tag like v1.2.0 to build Veil for macOS and Linux and attach the apps to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Fetch lyrebird from the signed Tor Browser release
        run: scripts/fetch-lyrebird.sh
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: veil-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Veil $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
