name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax & data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  selftest:
    # Starts a real tor and runs Veil's 37 anonymity checks against the live Tor network.
    # Manual only: it depends on the Tor network being reachable from GitHub's runners.
    name: Anonymity self-test (live Tor)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: brew install tor
      - run: npm ci
      - run: npm run selftest
