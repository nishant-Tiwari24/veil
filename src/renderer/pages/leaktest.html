<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leak Test</title>
<style>
  :root { --text:#1b1b1b; --dim:#5f6368; --faint:#9a9da2; --line:#c9cacd; --edge:#8f9297; --red:#c4161c; --red-dark:#8f0f13;
          --ui: "Segoe UI", Tahoma, Verdana, sans-serif; --mono: "Courier New", Courier, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text); font: 13px/1.45 var(--ui); }
  main { max-width: 820px; margin: 0 auto; padding: 36px 24px 64px; }
  h1 { font: bold 22px var(--ui); margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 18px; font-size: 12px; }
  h2 { margin: 22px 0 0; padding: 5px 10px; font: bold 12px var(--ui); background: linear-gradient(#fff, #e4e5e7);
       border: 1px solid var(--line); }
  button { height: 27px; padding: 0 12px; border: 1px solid #a7a9ad; border-radius: 3px; color: #222; font: 12px var(--ui);
           background: linear-gradient(#fff, #e3e3e3); }
  button:hover { border-color: #7d8085; }
  button:disabled { color: var(--faint); }
  .checks { border: 1px solid var(--line); border-top: 0; }
  .checks:empty { display: none; }
  .check { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px 10px;
           border-top: 1px solid #ececed; }
  .check:nth-child(even) { background: #f8f8f9; }
  .check .icon { font: bold 11px var(--mono); }
  .check .label b { display: block; }
  .check .label span { color: var(--dim); font-size: 11px; }
  .check .value { font: 11px var(--mono); color: var(--dim); text-align: right; max-width: 320px; word-break: break-all; }
  .pass .icon { color: #000; } .fail .icon { color: var(--red); } .fail .label b { color: var(--red); } .pending .icon { color: var(--faint); }
</style>
</head>
<body>
<main>
  <h1>Leak test</h1>
  <p class="sub">Checks what the network and websites can learn about you. Fingerprint values below are exactly what every website sees.</p>

  <button id="run">Run network test</button>
  <h2>Network</h2>
  <div class="checks" id="net"></div>

  <h2>Fingerprint (what websites see)</h2>
  <div class="checks" id="fp"></div>
</main>
<script>
const $ = id => document.getElementById(id)
function row(container, state, title, detail, value) {
  const r = document.createElement('div')
  r.className = 'check ' + state
  const icon = document.createElement('div'); icon.className = 'icon'
  icon.textContent = state === 'pass' ? '[PASS]' : state === 'fail' ? '[FAIL]' : '[....]'
  const label = document.createElement('div'); label.className = 'label'
  const b = document.createElement('b'); b.textContent = title
  const s = document.createElement('span'); s.textContent = detail
  label.append(b, s)
  const v = document.createElement('div'); v.className = 'value'; v.textContent = value ?? ''
  r.append(icon, label, v)
  container.append(r)
}

$('run').onclick = async () => {
  const net = $('net')
  net.replaceChildren()
  $('run').disabled = true
  row(net, 'pending', 'Testing through Tor...', 'Asking check.torproject.org from two isolated sites', '')
  try {
    const r = await veil.networkTest()
    net.replaceChildren()
    const tor = r.tor || {}
    row(net, tor.IsTor ? 'pass' : 'fail', 'Traffic goes through Tor', 'check.torproject.org confirms the request came from a Tor exit', tor.IP || tor.error)
    const iso = r.isolated || {}
    const isolated = tor.IP && iso.IP && tor.IP !== iso.IP
    row(net, isolated ? 'pass' : 'fail', 'Sites are isolated', 'Two different sites got two different exit IPs', `${tor.IP || '?'}  vs  ${iso.IP || iso.error || '?'}`)
    row(net, r.dns?.blocked ? 'pass' : 'fail', 'No local DNS', "The browser can't resolve names itself — only Tor can", r.dns?.blocked ? 'resolver disabled' : 'LEAK')
  } catch (e) {
    net.replaceChildren()
    row(net, 'fail', 'Network test failed', e.message.replace(/^.*Error: /, ''), '')
  }
  $('run').disabled = false
}

function canvasHash() {
  const c = document.createElement('canvas'); c.width = 220; c.height = 40
  const x = c.getContext('2d')
  x.fillStyle = '#f60'; x.fillRect(10, 5, 100, 30)
  x.fillStyle = '#069'; x.font = '16px Arial'; x.fillText('Veil fingerprint', 4, 24)
  let h = 0
  for (const ch of c.toDataURL()) h = (Math.imul(h, 31) + ch.charCodeAt(0)) | 0
  return (h >>> 0).toString(16)
}

function webglRenderer() {
  try {
    const gl = document.createElement('canvas').getContext('webgl')
    if (!gl) return null
    return gl.getParameter(0x9246)
  } catch { return null }
}

const fp = $('fp')
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone
row(fp, tz === 'UTC' || tz === 'Etc/UTC' ? 'pass' : 'fail', 'Timezone', 'Everyone reports UTC', `${tz} (offset ${new Date().getTimezoneOffset()})`)
row(fp, 'pass', 'User agent', 'Same common value for every Veil user', navigator.userAgent)
row(fp, navigator.platform === 'Win32' ? 'pass' : 'fail', 'Platform', 'Hides your real OS', navigator.platform)
row(fp, 'pass', 'Languages', 'Always en-US', navigator.languages.join(', '))
row(fp, navigator.hardwareConcurrency === 4 ? 'pass' : 'fail', 'CPU cores / memory', 'Fixed values', `${navigator.hardwareConcurrency} cores · ${navigator.deviceMemory} GB`)
row(fp, screen.width === innerWidth ? 'pass' : 'fail', 'Screen size', 'Reports the letterboxed window, not your monitor', `${screen.width}×${screen.height} @${devicePixelRatio}x`)
row(fp, typeof RTCPeerConnection === 'undefined' ? 'pass' : 'fail', 'WebRTC', 'Removed — it can reveal your real IP', typeof RTCPeerConnection === 'undefined' ? 'disabled' : 'AVAILABLE')
const gl = webglRenderer()
row(fp, !gl || /Generic/.test(gl) ? 'pass' : 'fail', 'WebGL GPU', 'Real graphics card hidden', gl || 'WebGL disabled')
row(fp, 'pass', 'Canvas fingerprint', 'Noised per site & identity — changes after New Identity', canvasHash())
</script>
</body>
</html>
